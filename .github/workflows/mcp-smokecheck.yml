name: MCP smokecheck validation

on:
  push:
    branches:
      - opensource-mcp-streamable-http-smokecheck
  pull_request:
    paths:
      - mcp-streamable-http-smokecheck/**
      - .github/workflows/mcp-smokecheck.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install utility dependency
        run: python -m pip install --upgrade pip && pip install -r mcp-streamable-http-smokecheck/requirements.txt

      - name: Compile utility
        run: python -m py_compile mcp-streamable-http-smokecheck/smokecheck.py

      - name: Check CLI help
        run: python mcp-streamable-http-smokecheck/smokecheck.py --help
